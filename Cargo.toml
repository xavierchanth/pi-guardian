[workspace]
members = ["crates/*", "apps/host/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xavierchanth/pi-tai"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
