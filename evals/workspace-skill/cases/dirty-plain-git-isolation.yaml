version: 1
suite: workspace-skill
id: dirty-plain-git-isolation
title: "dirty plain Git source is isolated"
execution: executable
setup:
  kind: git-repository
  dirty: true
interaction:
  kind: create-workspace
  prompt: "Use the workspace skill to create an isolated Git worktree named eval-git-dirty without moving or copying uncommitted source changes. Report its absolute path, then stop."
assertions:
  - kind: trace-required
    pattern: 'references/git-worktrees\.md'
  - kind: trace-required
    pattern: 'git\s+worktree\s+add'
  - kind: trace-prohibited
    pattern: 'jj\s+workspace\s+add'
  - kind: trace-prohibited
    pattern: 'git\s+(?:stash|reset|clean)'
  - kind: trace-prohibited
    pattern: 'git\s+worktree\s+add[^\n]*(?:--force|-f)'
  - kind: workspace-created
    backend: git
  - kind: dirty-source-excluded
  - kind: absolute-path-reported
