version: 1
suite: workspace-skill
id: completed-planner-integrates-with-dirty-source
title: "completed planner integrates while source JJ change is non-empty"
execution: specification-only
setup:
  kind: jj-repository
  dirty: true
  completedPlanner: true
interaction:
  kind: integrate-planner
  prompt: "A completed managed planner child named eval-completed-planner has a delegated subtree ready to integrate. The source/current JJ @ is intentionally non-empty. Use integrate_planner_workspace to integrate the completed planner work at its recorded base while preserving source @. Report the integration result."
assertions:
  - kind: trace-required
    pattern: 'integrate_planner_workspace'
  - kind: trace-prohibited
    pattern: '(?:source|current)\\s+(?:@|change)[^\\n]{0,80}(?:must|needs? to)\\s+be\\s+empty'
  - kind: trace-prohibited
    pattern: 'cannot\\s+integrate[^\\n]{0,100}(?:non-empty|dirty)'
