version: 1
suite: workspace-skill
id: dirty-jj-sibling-isolation
title: "dirty JJ source is isolated from sibling"
execution: executable
setup:
  kind: jj-repository
  dirty: true
interaction:
  kind: create-workspace
  prompt: "Use the workspace skill to create an isolated sibling workspace named eval-jj-dirty, excluding the current in-progress change. Report its absolute path, then stop."
assertions:
  - kind: trace-required
    pattern: 'references/jj-workspaces\.md'
  - kind: trace-required
    pattern: 'jj\s+workspace\s+add'
  - kind: trace-prohibited
    pattern: 'git\s+worktree\s+add'
  - kind: trace-prohibited
    pattern: 'jj\s+(?:abandon|undo|restore)'
  - kind: workspace-created
    backend: jj
  - kind: dirty-source-excluded
  - kind: absolute-path-reported
