version: 1
suite: workspace-skill
id: colocated-explicit-git
title: "explicit Git request routes to Git"
execution: executable
setup:
  kind: jj-repository
  dirty: false
interaction:
  kind: create-workspace
  prompt: "Use the workspace skill to create a Git worktree named eval-explicit-git. Do not use a JJ workspace. Report its absolute path, then stop."
assertions:
  - kind: trace-required
    pattern: 'references/git-worktrees\.md'
  - kind: trace-required
    pattern: 'git\s+worktree\s+add'
  - kind: trace-prohibited
    pattern: 'jj\s+workspace\s+add'
  - kind: trace-prohibited
    pattern: 'git\s+worktree\s+add[^\n]*(?:--force|-f)'
  - kind: workspace-created
    backend: git
  - kind: absolute-path-reported
