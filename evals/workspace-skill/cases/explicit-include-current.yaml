version: 1
suite: workspace-skill
id: explicit-include-current
title: "explicit include-current uses current JJ revision"
execution: executable
setup:
  kind: jj-repository
  dirty: true
interaction:
  kind: create-workspace
  prompt: "Use the workspace skill to create a JJ workspace named eval-include-current and explicitly include the current change. Report its absolute path, then stop."
assertions:
  - kind: trace-required
    pattern: 'references/jj-workspaces\.md'
  - kind: trace-required
    pattern: 'jj\s+workspace\s+add[\s\S]*(?:-r|--revision)\s+@(?:\s|$)'
  - kind: trace-prohibited
    pattern: 'git\s+worktree\s+add'
  - kind: workspace-created
    backend: jj
  - kind: absolute-path-reported
