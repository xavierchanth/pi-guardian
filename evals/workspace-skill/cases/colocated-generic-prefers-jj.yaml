version: 1
suite: workspace-skill
id: colocated-generic-prefers-jj
title: "generic request in colocated repository prefers JJ"
execution: executable
setup:
  kind: jj-repository
  dirty: false
interaction:
  kind: create-workspace
  prompt: "Use the workspace skill to create a workspace named eval-generic for this task. Use the preferred/default backend. Report its absolute path, then stop."
assertions:
  - kind: trace-required
    pattern: 'references/jj-workspaces\.md'
  - kind: trace-required
    pattern: 'jj\s+workspace\s+add'
  - kind: trace-prohibited
    pattern: 'git\s+worktree\s+add'
  - kind: workspace-created
    backend: jj
  - kind: absolute-path-reported
