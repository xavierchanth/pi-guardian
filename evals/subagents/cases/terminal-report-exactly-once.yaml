version: 1
suite: subagents
id: terminal-report-exactly-once
title: "A child reports terminal outcome exactly once"
execution: specification-only
setup: { kind: subagent-harness, parentRole: implementation-lead, childRole: worker, childOutcome: completed }
interaction: { kind: terminal-report, attemptedReports: 2 }
assertions:
  - { kind: protocol-invariant, invariant: single-terminal-report }
  - { kind: report-count, phase: terminal, count: 1 }
